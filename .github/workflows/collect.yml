name: 일정 수집

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (UTC 기준 0,6,12,18시 = KST 9,15,21,3시). 혼잡 시 몇십 분 늦을 수 있음
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      game:
        description: "게임 id (비우면 전체). 예: genshin, hsr, wuwa, nte"
        required: false
        default: ""

permissions:
  contents: write            # data/ 커밋용

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GAME: ${{ inputs.game }}
        run: |
          if [ -n "$GAME" ]; then
            python collector/collect.py --game "$GAME"
          else
            python collector/collect.py
          fi

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 파일 없음"
            exit 0
          fi
          git commit -m "data: 일정 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
