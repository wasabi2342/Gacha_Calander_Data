name: 일정 수집

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (UTC 기준 0,6,12,18시 = KST 9,15,21,3시). 혼잡 시 몇십 분 늦을 수 있음
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      game:
        description: "게임 id (비우면 전체). 예: genshin, hsr, wuwa, nte, nikke"
        required: false
        default: ""
      reprocess:
        description: "이미 분석한 기사도 다시 분석 (추출 규칙을 고친 뒤에 사용)"
        type: boolean
        required: false
        default: false
      reset:
        description: "일정 초기화 후 다시 수집"
        type: choice
        options:
          - "안 함"
          - "선택한 게임만 (game 필수)"
          - "전체 게임"
        default: "안 함"

permissions:
  contents: write            # data/ 커밋용

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 전체 초기화 때는 게임 9개 × 기사 12개라 오래 걸림
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}     # Gemini(또는 Anthropic) API 키
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}      # 비워두면 gemini
          MODEL: ${{ vars.MODEL }}                    # 비워두면 제공자별 기본 모델
          GAME: ${{ inputs.game }}
          REPROCESS: ${{ inputs.reprocess }}
          RESET: ${{ inputs.reset }}
        run: |
          ARGS=""
          if [ -n "$GAME" ]; then ARGS="$ARGS --game $GAME"; fi
          if [ "$REPROCESS" = "true" ]; then ARGS="$ARGS --reprocess"; fi
          case "$RESET" in
            "선택한 게임만"*)
              if [ -z "$GAME" ]; then echo "::error::'선택한 게임만' 초기화는 game 칸을 채워야 해요"; exit 1; fi
              ARGS="$ARGS --reset" ;;
            "전체 게임")
              if [ -n "$GAME" ]; then echo "::error::'전체 게임' 초기화는 game 칸을 비워야 해요"; exit 1; fi
              ARGS="$ARGS --reset-all" ;;
          esac
          python collector/collect.py $ARGS

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 파일 없음"
            exit 0
          fi
          git commit -m "data: 일정 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
